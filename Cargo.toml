[package]
name = "wgpu-code-driven-engine"
version = "0.1.0"
authors = ["Lbaodz"]
license = "MIT OR Apache-2.0"
edition = "2024"

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive"] }
pollster = "0.4.0"
wgpu = "29.0"
winit = "0.30.13"
gltf = { version = "1.4" }
serde_json = "1.0.150"
serde = { version = "1.0", features = ["derive"] }
rapier3d = { version = "0.33.0", features = ["simd-stable"] }

# debug delete later
sysinfo = "0.33"

egui = "0.35.0"
egui-winit = "0.35.0"
egui-wgpu = "0.35.0"
rodio = "0.22.2"
rayon = "1.12.0"
ctt = "0.5.0"
bincode = "1.3"
pub-fields = "0.1.1"
zstd = "0.13"
glam = { version = "0.33.2", features = ["bytemuck", "serde", "fast-math"] }
